runs:
  - name: smoke_multi360_prefix_temporal
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 1
      train.batch_size: 1
      train.num_workers: 0
      train.progress_bar: false
      train.validate_process_metrics: true
      train.selection_metric: macro_process_temporal_kld_sph
      train.selection_mode: min
      train.max_train_samples: 6
      train.max_val_samples: 3
      train.condition_prefix_bins: 2
      train.condition_prefix_step_channel: true
      model.in_channels: 10
      model.num_bins: 4
      model.base_channels: 8
      model.hidden_channels: 16
      model.semantic_layer: layer2
      model.semantic_pretrained: false
      loss.final_kl: 0.2
      loss.final_cc: 0.2
      loss.final_nss: 0.0
      loss.static: 0.05
      loss.temporal: 0.0
      loss.temporal_frame_align: 1.0
      loss.temporal_profile: 0.5
      loss.cumulative: 0.3
      loss.temporal_process_tv: 0.1
      loss.cumulative_process_tv: 0.05
      loss.accumulation: 0.0
      loss.memory: 0.01
      loss.residual: 0.0001

  - name: smoke_multi360_prefix_temporal_shuffled
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 1
      train.batch_size: 1
      train.num_workers: 0
      train.progress_bar: false
      train.validate_process_metrics: true
      train.selection_metric: macro_process_temporal_kld_sph
      train.selection_mode: min
      train.shuffle_temporal_labels: true
      train.max_train_samples: 6
      train.max_val_samples: 3
      train.condition_prefix_bins: 2
      train.condition_prefix_step_channel: true
      model.in_channels: 10
      model.num_bins: 4
      model.base_channels: 8
      model.hidden_channels: 16
      model.semantic_layer: layer2
      model.semantic_pretrained: false
      loss.final_kl: 0.2
      loss.final_cc: 0.2
      loss.final_nss: 0.0
      loss.static: 0.05
      loss.temporal: 0.0
      loss.temporal_frame_align: 1.0
      loss.temporal_profile: 0.5
      loss.cumulative: 0.3
      loss.temporal_process_tv: 0.1
      loss.cumulative_process_tv: 0.05
      loss.accumulation: 0.0
      loss.memory: 0.01
      loss.residual: 0.0001
