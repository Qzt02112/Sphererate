runs:
  - name: multi360_smoke_static_balanced
    model: static
    overrides:
      train.epochs: 1
      train.max_train_samples: 6
      train.max_val_samples: 6
      train.save_predictions: false
      train.experiment: multi360_smoke_static_balanced
      train.dataset_balanced_sampling: true
      train.selection_metric: macro_kld_sph
      train.selection_mode: min
      train.augment_roll: true
      train.augment_roll_degrees: [0, 60, 120, 180, 240, 300]

  - name: multi360_smoke_semantic_static_balanced
    model: semantic_static
    overrides:
      train.epochs: 1
      train.max_train_samples: 6
      train.max_val_samples: 6
      train.save_predictions: false
      train.experiment: multi360_smoke_semantic_static_balanced
      train.dataset_balanced_sampling: true
      train.selection_metric: macro_kld_sph
      train.selection_mode: min
      train.augment_roll: true
      train.augment_roll_degrees: [0, 60, 120, 180, 240, 300]
      model.semantic_pretrained: false
