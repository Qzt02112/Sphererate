# HISTORICAL/CLOSED: referenced generated view and checkpoints were cleaned on 2026-07-13.
protocol: initial_start_conditioned_late_saliency
gate: R1

data:
  view_root: data/processed/future_saliency_etdk2_sitzmann_salient360_v1
  session_manifest: etdk2_sessions.jsonl
  content_manifest: salient360_static.jsonl
  selection_split: train
  evaluation_split: val
  image_size: [256, 512]
  sigma_px: 10.0

targets:
  primary:
    name: late_5_25
    start_s: 5.0
    end_s: 25.0
  diagnostic:
    name: full_0_25
    start_s: 0.0
    end_s: 25.0

fusion:
  type: log_density
  alpha_grid: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]

controls:
  wrong_start_offset_deg: 180.0
  wrong_content_seed: 20260711

statistics:
  bootstrap_group: canonical_content_id
  bootstrap_iterations: 10000
  bootstrap_seed: 20260711

output:
  root: reports/gate_r1_start_conditioned_late
