protocol: sitzmann_cross_dataset_benchmark_v1

seeds: [20260710, 20260711, 20260712]
horizons_s: [0.5, 1.0, 3.0, 5.0]
primary_horizons_s: [0.5, 1.0, 3.0]
renderer:
  family: sphere_chord
  sigma_deg: 2.0
metrics: [kld_sph, sim_sph, cc_sph]
coverage:
  metric: fixation_dwell_mass
  tile_grid: [8, 16]
  budgets_percent: [5.0, 10.0, 20.0]
  tile_count_rounding: ceil
  selected_tile_counts: [7, 13, 26]

datasets:
  salient360:
    root: data/processed/early_horizon_salient360_spherical2deg_v2
    manifest: data/processed/early_horizon_salient360_spherical2deg_v2/manifest.jsonl
    train_split: train
    selection_split: val
    evaluation_split: gate
    expected_rows: {train: 50, val: 9, gate: 13}
    expected_scenes: {train: 50, val: 9, gate: 13}
    start_x_norm: 0.75
    external_scanpath_start_yaw_deg: 90.0
  sitzmann:
    root: data/processed/sitzmann_official_256x512_spherical2deg_v1
    manifest: data/processed/sitzmann_official_256x512_spherical2deg_v1/manifest.jsonl
    train_split: train
    selection_split: val
    evaluation_split: gate
    expected_rows: {train: 64, val: 12, gate: 12}
    expected_scenes: {train: 16, val: 3, gate: 3}
    start_x_norm: 0.5
    external_scanpath_start_yaw_deg: 0.0
    aggregate_conditions_by: canonical_content_id

cross_views:
  salient360_to_sitzmann_start:
    source_dataset: salient360
    model_source: sitzmann
    shift_px: -128
    output_root: data/processed/cross_view_salient360_at_sitzmann_start_v1
  sitzmann_to_salient360_start:
    source_dataset: sitzmann
    model_source: salient360
    shift_px: 128
    output_root: data/processed/cross_view_sitzmann_at_salient360_start_v1

selection:
  checkpoint: source_validation_only
  reachability: source_train_only
  deepgaze_calibration: source_train_only
  target_domain_adaptation: forbidden
  target_validation_for_cross_domain_selection: forbidden

methods:
  spherehorizon:
    kind: cumulative_map
    training: same_split
    seeds: 3
  tempsal_erp:
    kind: cumulative_map
    training: same_split
    seeds: 3
  panoramic_cnn:
    kind: final_map_repeat
    training: same_split
    seeds: 3
  scandmm:
    kind: scanpath
    training: same_split
    start_aware: true
    seeds: 3
  pathformer3d:
    kind: scanpath
    training: same_split
    start_aware: true
    seeds: 3
  bms360:
    kind: deterministic_final_map_repeat
    training: not_applicable
  gbvs360:
    kind: deterministic_final_map_repeat
    training: not_applicable
  deepgaze_msdb:
    kind: pretrained_final_map_repeat
    training: frozen_external
    calibration: source_train_only

reachability:
  quantile: 0.95
  weighting: clipped_dwell_duration
  distance: great_circle
  gate: hard
  calibration_split: train

reporting:
  primary_unit: canonical_scene
  sitzmann_condition_policy: mean_within_scene_then_macro_across_scenes
  seed_policy: score_each_seed_then_report_mean_and_sample_std
  sealed_test_target_loads: 0
