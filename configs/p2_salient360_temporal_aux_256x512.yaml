project:
  name: sphererate
  seed: 20260711

paths:
  processed_root: data/processed
  runs_root: runs
  reports_root: reports

data:
  dataset: salient360_p2
  processed_name: p2_salient360_temporal_aux_seed20260711
  image_size: [256, 512]
  num_bins: 6
  sigma_px: 10.0
  area_weighted: true

train:
  task: saliency
  model: semantic_static_aux
  experiment: p2_placeholder
  device: cuda
  epochs: 30
  batch_size: 4
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  selection_metric: kld_sph
  selection_mode: min
  progress_bar: false
  log_epoch_details: false
  augment_roll: true
  augment_roll_degrees: [0, 60, 120, 180, 240, 300]
  dataset_balanced_sampling: false
  shuffle_temporal_labels: false
  temporal_target_mode: correct
  condition_prefix_bins: 0
  condition_startpoint_channels: false
  validate_process_metrics: false
  save_predictions: true

model:
  in_channels: 8
  base_channels: 32
  hidden_channels: 64
  num_bins: 6
  semantic_backbone: resnet18
  semantic_layer: layer3
  semantic_pretrained: true

loss:
  final_kl: 1.0
  final_cc: 1.0
  final_nss: 0.1
  condition_contrastive: 0.0
  static: 0.0
  temporal: 0.0
  temporal_frame_align: 0.0
  temporal_profile: 0.0
  cumulative: 0.0
  temporal_bin_kld: 0.0
  cumulative_bin_kld: 0.0
  temporal_process_tv: 0.0
  cumulative_process_tv: 0.0
  accumulation: 0.0
  memory: 0.0
  residual: 0.0
  teacher_residual_target: 0.0
  teacher_residual_topk: 0.0
  teacher_residual_peak: 0.0
  motion_bin_ce: 0.0
  motion_bin_soft_ce: 0.0

eval:
  area_weighted: true

