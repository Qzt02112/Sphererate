project:
  name: sphererate
  seed: 20260710

paths:
  raw_root: ${SCANDMM_ROOT}/data/raw
  processed_root: data/processed
  runs_root: runs
  reports_root: reports

data:
  dataset: jufe_start_conditioned
  processed_name: jufe_start_conditioned_256x512_k6_order_groupdisjoint_v1
  image_size: [256, 512]
  num_bins: 6
  split_seed: 20260710
  group_disjoint: true
  map_kernel: erp
  sigma_px: 10.0
  area_weighted: true
  use_official_final_map: false

train:
  task: saliency
  model: start_conditioned_light_residual
  experiment: gate_b_light_condition_actual_seed20260710
  device: cuda
  epochs: 30
  batch_size: 8
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  selection_metric: kld_sph
  selection_mode: min
  dataset_balanced_sampling: false
  augment_roll: true
  augment_roll_degrees: [0, 60, 120, 180, 240, 300]
  shuffle_temporal_labels: false
  condition_prefix_bins: 0
  condition_startpoint_channels: true
  startpoint_condition_mode: actual
  startpoint_random_seed: 20260710
  startpoint_prior_sigma_px: 10.0
  validate_process_metrics: false
  progress_bar: false
  log_epoch_details: false
  save_predictions: true

model:
  in_channels: 13
  static_in_channels: 8
  base_channels: 32
  hidden_channels: 64
  residual_hidden_channels: 16
  num_bins: 6
  semantic_backbone: resnet18
  semantic_layer: layer3
  semantic_pretrained: true
  teacher_checkpoint: runs/gate_a_static_semantic_finalonly_natural_seed20260710/checkpoints/best.pt
  teacher_residual_scale: 1.0
  teacher_residual_init_gate: -1.0

loss:
  final_kl: 1.0
  final_cc: 1.0
  final_nss: 0.1
  condition_contrastive: 0.0
  condition_contrastive_margin: 0.02
  static: 0.0
  temporal: 0.0
  temporal_frame_align: 0.0
  temporal_profile: 0.0
  cumulative: 0.0
  temporal_bin_kld: 0.0
  cumulative_bin_kld: 0.0
  temporal_process_tv: 0.0
  cumulative_process_tv: 0.0
  accumulation: 0.0
  memory: 0.0
  residual: 0.0001
  teacher_residual_target: 0.0
  teacher_residual_topk: 0.0
  teacher_residual_peak: 0.0
  motion_bin_ce: 0.0
  motion_bin_soft_ce: 0.0

eval:
  eps: 0.0000001
  area_weighted: true
