runs:
  - name: f2_256_semantic_static_30ep
    model: semantic_static
    overrides:
      train.epochs: 30
      train.experiment: f2_256_semantic_static_30ep
      model.semantic_pretrained: true
      model.semantic_layer: layer3

  - name: f2_256_semantic_dytsaldmm_30ep
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 30
      train.experiment: f2_256_semantic_dytsaldmm_30ep
      model.semantic_pretrained: true
      model.semantic_layer: layer3

  - name: f2_256_semantic_dytsaldmm_shuffled_temporal_30ep
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 30
      train.experiment: f2_256_semantic_dytsaldmm_shuffled_temporal_30ep
      train.shuffle_temporal_labels: true
      model.semantic_pretrained: true
      model.semantic_layer: layer3
