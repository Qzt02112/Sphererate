protocol: P0_image_only
gate: A-2
claim_tested: a semantic image-only final head is a stable strong baseline on the clean group-disjoint validation protocol
locked_baseline: semantic_static_finalonly_natural_3seed
matched_control: uniform, equator, and train-average priors from Gate A-1
decision_rule: 3 seeds finish without collapse and consistently beat the strongest prior on primary mixed/macro metrics; final test remains unopened
test_status: frozen_not_evaluated

