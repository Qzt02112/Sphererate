protocol: P0_image_only
gate: C-pilot
claim_tested: probability-space marginalization of three real viewing stages improves image-only final saliency beyond static, ordinary logit pooling, and randomized condition correspondence
locked_baseline: semantic_static_finalonly_natural_seed20260710
matched_control: same frozen teacher, shared residual head, selector, temporal supervision, optimizer, augmentation, and budget
decision_rule: proposed has lower val mixed and macro KLD_sph than all three controls without primary SIM_sph or CC_sph regression; added parameters below 10%; final test remains unopened
test_status: frozen_not_evaluated

runs:
  - name: gate_c_marginal_proposed_mh_s4_t2_seed20260710
    model: image_only_latent_marginal
    overrides: &pilot_common
      project.seed: 20260710
      train.data_seed: 20260710
      train.sampler_seed: 20260710
      train.epochs: 30
      train.batch_size: 4
      train.num_workers: 4
      train.lr: 0.0003
      train.weight_decay: 0.0001
      train.amp: true
      train.progress_bar: false
      train.log_epoch_details: false
      train.dataset_balanced_sampling: false
      train.selection_metric: macro_kld_sph
      train.selection_mode: min
      train.augment_roll: true
      train.augment_roll_degrees: [0, 60, 120, 180, 240, 300]
      train.shuffle_temporal_labels: false
      train.condition_prefix_bins: 0
      train.condition_startpoint_channels: false
      train.validate_process_metrics: false
      train.save_predictions: true
      model.in_channels: 8
      model.num_bins: 3
      model.latent_num_conditions: 3
      model.latent_code_channels: 4
      model.latent_conditioning: shared_multihead
      model.residual_hidden_channels: 16
      model.latent_aggregation: density_marginal
      model.semantic_pretrained: true
      model.semantic_layer: layer3
      model.teacher_checkpoint: runs/gate_a_static_semantic_finalonly_natural_seed20260710/checkpoints/best.pt
      model.teacher_residual_scale: 4.0
      model.teacher_residual_init_gate: -1.0
      loss.final_kl: 1.0
      loss.final_cc: 1.0
      loss.final_nss: 0.1
      loss.condition_contrastive: 0.0
      loss.static: 0.0
      loss.temporal: 2.0
      loss.temporal_frame_align: 0.0
      loss.temporal_profile: 0.0
      loss.cumulative: 0.0
      loss.temporal_bin_kld: 0.0
      loss.cumulative_bin_kld: 0.0
      loss.temporal_process_tv: 0.0
      loss.cumulative_process_tv: 0.0
      loss.accumulation: 0.0
      loss.memory: 0.0
      loss.residual: 0.0001
      loss.teacher_residual_target: 0.0
      loss.teacher_residual_topk: 0.0
      loss.teacher_residual_peak: 0.0
      loss.motion_bin_ce: 0.0
      loss.motion_bin_soft_ce: 0.0

  - name: gate_c_temporal_aux_mh_s4_t2_seed20260710
    model: image_only_temporal_aux
    overrides:
      <<: *pilot_common
      model.latent_aggregation: logit_pool

  - name: gate_c_random_condition_mh_s4_t2_seed20260710
    model: image_only_latent_marginal
    overrides:
      <<: *pilot_common
      train.shuffle_temporal_labels: true
