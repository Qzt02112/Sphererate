  processed_root: data/processed
  runs_root: runs
  reports_root: reports

data:
  dataset: salient360_early_horizon
  processed_name: early_horizon_salient360_v1
  image_size: [256, 512]
  horizons_s: [0.5, 1.0, 3.0, 5.0]
  primary_horizons_s: [0.5, 1.0, 3.0]
  sigma_px: 10.0
  area_weighted: true
  primary_eye: R
  sensitivity_eye: L
  declared_start_yaw_deg: 90.0
  canonical_start_x_norm: 0.75
