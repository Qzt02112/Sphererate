project:
  name: sitzmann_standard_v2_sphererate
  seed: 20260711

paths:
  processed_root: data/processed
  processed_name: sitzmann_official_256x512_spherical2deg_standard_v2
  runs_root: runs/sitzmann_standard_v2
  reports_root: reports/sitzmann_standard_v2

data:
  image_size: [256, 512]
  horizons_s: [0.5, 1.0, 3.0, 5.0]
  primary_horizons_s: [0.5, 1.0, 3.0]
  renderer: sphere_chord
  sigma_deg: 2.0
  target_version: 2

model:
  in_channels: 8
  base_channels: 32
  hidden_channels: 64
  semantic_backbone: resnet18
  semantic_layer: layer3
  semantic_pretrained: true
  family: spherical_dwell_rate
  semantic_alpha_init: [0.05, 0.20, 0.65, 0.90]
  reachability_mode: anisotropic_tangent
  # The first second is fitted from clipped dwell on the 16 training scenes.
  # Later intervals retain the weak isotropic cost used by V12-C so image
  # utility, rather than a dataset-level population prior, drives exploration.
  reachability_beta_init: [48.040, 4.744, 0.450, 0.100]
  reachability_north_beta_init: [34.384, 6.130, 0.450, 0.100]
  reachability_offset_deg_init:
    - [-1.12, 0.82]
    - [-1.02, -7.08]
    - [0.00, 0.00]
    - [0.00, 0.00]
  maximum_reachability_offset_deg: 30.0
  interval_residual_scale: 2.0
  semantic_anchor_checkpoint: runs/sitzmann_standard_v2/semantic_anchor_seed20260711/checkpoints/best.pt
  freeze_semantic_anchor_features: true
  freeze_semantic_anchor_map: true

train:
  device: cuda
  epochs: 25
  batch_size: 4
  num_workers: 2
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  seed: 20260711
  data_seed: 20260711
  sampler_seed: 20260711
  selection_metric: v11_worst_endpoint_margin_with_density_guard
  selection_mode: max_with_guard
  kld_weight: 1.0
  cc_weight: 0.5
  sim_weight: 0.25
  semantic_anchor_weight: 0.0
  semantic_ratio_weight: 0.0
  tile_kl_weight: 0.0
  tile_rank_weight: 0.0
  raw_tile_kl_weight: 0.10
  raw_frontier_rank_weight: 0.0
  soft_topk_coverage_weight: 0.20
  soft_topk_epsilon: 0.15
  soft_topk_iterations: 30
  tile_rows: 8
  tile_cols: 16
  tile_horizon_weights: [0.25, 0.50, 1.00, 1.25]
  coverage_budgets: [5.0, 10.0, 15.0, 20.0]
  coverage_selection_budgets: [5.0, 10.0, 20.0]
  selection_reference:
    source: sitzmann_only_TempSAL_ERP_3seed_val
    early_macro:
      kld_sph: 1.2343711999279483
      sim_sph: 0.4732535366934758
      cc_sph: 0.708019978625
      coverage_5: 0.8710939795882614
      coverage_10: 0.9130030572414398
      coverage_20: 0.9517100834184222
    horizon_5:
      kld_sph: 1.847575436035792
      sim_sph: 0.344033767365747
      cc_sph: 0.5687307590475517
      coverage_5: 0.5024719254838096
      coverage_10: 0.6549772131774161
      coverage_20: 0.800963414212068
  density_guard:
    early_macro:
      kld_max: 1.2443711999279483
      cc_min: 0.703019978625
    horizon_5:
      kld_max: 1.857575436035792
      cc_min: 0.5637307590475517
  outer_test: ordinary_repeatable_evaluation_never_model_selection

statistics:
  bootstrap_group: canonical_content_id
  bootstrap_resamples: 10000
  bootstrap_seed: 20260806

protocol:
  stage: sitzmann_only_v12c_three_seed
  split: train16_val3_test3
  initialization: sitzmann_train16_static_and_semantic_anchor
  inputs: [ERP_image, declared_start, horizon]
  forbidden_inputs: [TempSAL_prediction, gaze_history, test_labels]
  design_split: train
  selection_split: val
  report_split: test
  forbidden_for_selection: [test]
  test_may_be_evaluated_repeatedly: true
  dynamics: early_anisotropic_then_weak_isotropic_nonnegative_dwell_rate
  calibration_source: sitzmann_train16_clipped_dwell_first_second_only
  deployment_loss: entropy_regularized_multi_budget_soft_topk
