application:
  tile_grid: [8, 16]
  budgets_percent: [5, 10, 20]
  primary_budget_percent: 10
  budget_rounding: ceil
  coverage: raw_clipped_fixation_dwell_fraction

statistics:
  bootstrap_group: canonical_content_id
  bootstrap_resamples: 10000
  bootstrap_seed: 20260711

baseline:
  strong_static_checkpoint: runs/p2_final_only_seed20260711/checkpoints/best.pt
  train_template_policy: leave_one_content_out
  test_predictions: forbidden

model:
  status: forbidden_until_EH2_pass
  family: template_time_gated_image_residual
  recurrent: false
  attention_temporal_stack: false
