runs:
  - name: multi360_prefix_static_yaw60_12ep
    model: semantic_static
    overrides:
      train.epochs: 12
      train.batch_size: 2
      train.progress_bar: false
      train.validate_process_metrics: true
      train.selection_metric: macro_kld_sph
      train.selection_mode: min
      train.condition_prefix_bins: 2
      train.condition_prefix_step_channel: true
      model.in_channels: 10
      model.num_bins: 4
      loss.final_kl: 1.0
      loss.final_cc: 1.0
      loss.final_nss: 0.0
      loss.static: 0.0
      loss.temporal: 0.0
      loss.temporal_frame_align: 0.0
      loss.temporal_profile: 0.0
      loss.cumulative: 0.0
      loss.temporal_process_tv: 0.0
      loss.cumulative_process_tv: 0.0
      loss.accumulation: 0.0
      loss.memory: 0.0
      loss.residual: 0.0

  - name: multi360_prefix_temporal_yaw60_12ep
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 12
      train.batch_size: 2
      train.progress_bar: false
      train.validate_process_metrics: true
      train.selection_metric: macro_process_temporal_kld_sph
      train.selection_mode: min
      train.condition_prefix_bins: 2
      train.condition_prefix_step_channel: true
      model.in_channels: 10
      model.num_bins: 4
      loss.final_kl: 0.2
      loss.final_cc: 0.2
      loss.final_nss: 0.0
      loss.static: 0.05
      loss.temporal: 0.0
      loss.temporal_frame_align: 1.0
      loss.temporal_profile: 0.5
      loss.cumulative: 0.3
      loss.temporal_process_tv: 0.1
      loss.cumulative_process_tv: 0.05
      loss.accumulation: 0.0
      loss.memory: 0.01
      loss.residual: 0.0001

  - name: multi360_prefix_temporal_shuffled_yaw60_12ep
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 12
      train.batch_size: 2
      train.progress_bar: false
      train.validate_process_metrics: true
      train.selection_metric: macro_process_temporal_kld_sph
      train.selection_mode: min
      train.shuffle_temporal_labels: true
      train.condition_prefix_bins: 2
      train.condition_prefix_step_channel: true
      model.in_channels: 10
      model.num_bins: 4
      loss.final_kl: 0.2
      loss.final_cc: 0.2
      loss.final_nss: 0.0
      loss.static: 0.05
      loss.temporal: 0.0
      loss.temporal_frame_align: 1.0
      loss.temporal_profile: 0.5
      loss.cumulative: 0.3
      loss.temporal_process_tv: 0.1
      loss.cumulative_process_tv: 0.05
      loss.accumulation: 0.0
      loss.memory: 0.01
      loss.residual: 0.0001
