runs:
  - name: multi360_hard_timeprofile_yaw60_20ep
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 20
      train.experiment: multi360_hard_timeprofile_yaw60_20ep
      train.dataset_balanced_sampling: true
      train.progress_bar: false
      train.selection_metric: macro_kld_sph
      train.selection_mode: min
      train.augment_roll: true
      train.augment_roll_degrees: [0, 60, 120, 180, 240, 300]
      train.image_id_files:
        train: reports/multi360_temporal_hard_256/hard_train_top40_ids.txt
        val: reports/multi360_temporal_hard_256/hard_val_top40_ids.txt
      model.semantic_pretrained: true
      model.semantic_layer: layer3
      loss.temporal_frame_align: 1.0
      loss.temporal_profile: 1.0
      loss.cumulative: 0.1
      loss.accumulation: 0.0

  - name: multi360_hard_timeprofile_shuffled_yaw60_20ep
    model: semantic_dytsaldmm
    overrides:
      train.epochs: 20
      train.experiment: multi360_hard_timeprofile_shuffled_yaw60_20ep
      train.dataset_balanced_sampling: true
      train.progress_bar: false
      train.selection_metric: macro_kld_sph
      train.selection_mode: min
      train.augment_roll: true
      train.augment_roll_degrees: [0, 60, 120, 180, 240, 300]
      train.shuffle_temporal_labels: true
      train.image_id_files:
        train: reports/multi360_temporal_hard_256/hard_train_top40_ids.txt
        val: reports/multi360_temporal_hard_256/hard_val_top40_ids.txt
      model.semantic_pretrained: true
      model.semantic_layer: layer3
      loss.temporal_frame_align: 1.0
      loss.temporal_profile: 1.0
      loss.cumulative: 0.1
      loss.accumulation: 0.0
