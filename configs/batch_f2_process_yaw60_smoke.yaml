runs:
  - name: f2_process_smoke_teacher_residual_yaw60
    model: semantic_teacher_residual
    overrides:
      train.epochs: 2
      train.experiment: f2_process_smoke_teacher_residual_yaw60
      train.augment_roll: true
      train.augment_roll_degrees: [0, 60, 120, 180, 240, 300]
      model.teacher_checkpoint: runs/f2_256_semantic_static_yaw60_30ep/checkpoints/best.pt
      model.teacher_residual_scale: 1.0
      model.teacher_residual_init_gate: -2.0
      loss.static: 0.0
      loss.temporal: 1.0
      loss.cumulative: 1.0
      loss.temporal_process_tv: 0.5
      loss.cumulative_process_tv: 0.5
      loss.teacher_residual_target: 0.5
      loss.residual: 0.001

  - name: f2_process_smoke_teacher_residual_shuffled_yaw60
    model: semantic_teacher_residual
    overrides:
      train.epochs: 2
      train.experiment: f2_process_smoke_teacher_residual_shuffled_yaw60
      train.augment_roll: true
      train.augment_roll_degrees: [0, 60, 120, 180, 240, 300]
      train.shuffle_temporal_labels: true
      model.teacher_checkpoint: runs/f2_256_semantic_static_yaw60_30ep/checkpoints/best.pt
      model.teacher_residual_scale: 1.0
      model.teacher_residual_init_gate: -2.0
      loss.static: 0.0
      loss.temporal: 1.0
      loss.cumulative: 1.0
      loss.temporal_process_tv: 0.5
      loss.cumulative_process_tv: 0.5
      loss.teacher_residual_target: 0.5
      loss.residual: 0.001
