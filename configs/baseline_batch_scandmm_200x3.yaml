  - name: scandmm
    stage: infer
    split: test
    out: runs/f3_scandmm_seed2025_test_200
    vars: {n_scanpaths: 200, length: 20, seed: 2025}
  - name: scandmm
    stage: infer
    split: val
    out: runs/f3_scandmm_seed3407_val_200
    vars: {n_scanpaths: 200, length: 20, seed: 3407}
  - name: scandmm
    stage: infer
